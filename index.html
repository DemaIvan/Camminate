<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camminate Dashboard</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    .leaflet-control-layers { z-index: 25 !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .spinner {
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top: 3px solid #10b981;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      max-height: calc(100vh - 400px);
      overflow-y: auto;
    }
    .chart-box {
      height: 300px;
      position: relative;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col pb-20">

  <!-- HEADER -->
  <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700/80 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🥾</span>
      <div>
        <h1 class="font-bold text-base md:text-lg text-emerald-400 leading-tight">Camminate</h1>
        <p class="text-[10px] text-slate-400">Trentino & Alto Adige</p>
      </div>
    </div>
    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold flex items-center gap-1.5 shadow-lg transition-all">
      <span>➕</span> <span class="hidden sm:inline">Nuova</span>
    </button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5">

    <!-- TAB: DA FARE -->
    <section id="tab-dafare" class="tab-content space-y-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 sticky top-20 z-30">
        <p class="text-xs text-slate-400 mb-3">Da completare: <span id="countTodo" class="font-bold text-amber-400">0</span></p>
        
        <!-- Filtri -->
        <div class="space-y-3">
          <input type="text" id="filterNome" placeholder="🔍 Ricerca per nome..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <select id="filterDifficolta" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">Difficoltà</option>
              <option value="⭐">⭐</option>
              <option value="⭐⭐">⭐⭐</option>
              <option value="⭐⭐⭐">⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
            </select>

            <select id="filterStagione" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">Stagione</option>
              <option value="🌱">🌱 Primavera</option>
              <option value="☀️">☀️ Estate</option>
              <option value="🍂">🍂 Autunno</option>
              <option value="❄️">❄️ Inverno</option>
            </select>

            <label class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs cursor-pointer hover:border-emerald-500">
              <input type="checkbox" id="filterPasseggino" class="w-4 h-4 accent-emerald-500">
              <span>👶 Passeggino</span>
            </label>

            <label class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs cursor-pointer hover:border-emerald-500">
              <input type="checkbox" id="filterParco" class="w-4 h-4 accent-emerald-500">
              <span>🛝 Parco</span>
            </label>
          </div>
        </div>
      </div>
      
      <div id="gridTodo" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB: FATTO -->
    <section id="tab-fatto" class="tab-content hidden space-y-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 sticky top-20 z-30">
        <p class="text-xs text-slate-400 mb-3">Completate: <span id="countDone" class="font-bold text-emerald-400">0</span></p>
        
        <!-- Filtri -->
        <div class="space-y-3">
          <input type="text" id="filterNomeDone" placeholder="🔍 Ricerca per nome..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          
          <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
            <select id="filterDifficoltaDone" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">Difficoltà</option>
              <option value="⭐">⭐</option>
              <option value="⭐⭐">⭐⭐</option>
              <option value="⭐⭐⭐">⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
            </select>

            <select id="filterStagioneDone" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">Stagione</option>
              <option value="🌱">🌱 Primavera</option>
              <option value="☀️">☀️ Estate</option>
              <option value="🍂">🍂 Autunno</option>
              <option value="❄️">❄️ Inverno</option>
            </select>

            <label class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs cursor-pointer hover:border-emerald-500">
              <input type="checkbox" id="filterPasseginoDone" class="w-4 h-4 accent-emerald-500">
              <span>👶 Passeggino</span>
            </label>

            <label class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs cursor-pointer hover:border-emerald-500">
              <input type="checkbox" id="filterParcoDone" class="w-4 h-4 accent-emerald-500">
              <span>🛝 Parco</span>
            </label>
          </div>
        </div>
      </div>
      
      <div id="gridFatto" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB: MAPPA -->
    <section id="tab-mappa" class="tab-content hidden space-y-4">
      <div id="fullMap" class="w-full h-[calc(100vh-200px)] rounded-xl overflow-hidden border border-slate-700 shadow-md"></div>
    </section>

    <!-- TAB: STATS -->
    <section id="tab-stats" class="tab-content hidden space-y-4">
      <div class="stats-container">
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Fatte</p>
          <p id="statTotal" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Km</p>
          <p id="statKm" class="text-2xl font-bold text-sky-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Dislivello</p>
          <p id="statElevation" class="text-2xl font-bold text-amber-400 mt-1">0m</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Ore</p>
          <p id="statHours" class="text-2xl font-bold text-purple-400 mt-1">0h</p>
        </div>
      </div>

      <div class="charts-container">
        <div class="chart-box bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
          <h4 class="text-xs font-bold text-slate-300 mb-2">Stato</h4>
          <canvas id="chartCompletion"></canvas>
        </div>
        <div class="chart-box bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
          <h4 class="text-xs font-bold text-slate-300 mb-2">Dislivello per Uscita</h4>
          <canvas id="chartElevation"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- TABS NAVIGATION (BOTTOM) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 border-t border-slate-700 flex justify-around z-30">
    <button onclick="switchTab('dafare')" id="nav-dafare" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-emerald-400 hover:bg-slate-700/50">📝 Da fare</button>
    <button onclick="switchTab('fatto')" id="nav-fatto" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">✓ Fatto</button>
    <button onclick="switchTab('mappa')" id="nav-mappa" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">🗺️ Mappa</button>
    <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">📊 Stats</button>
  </nav>

  <!-- MODAL: AGGIUNGI/MODIFICA -->
  <div id="addModal" class="modal-backdrop hidden fixed inset-0 bg-black/50 flex items-end z-50">
    <div class="w-full bg-slate-800 rounded-t-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-emerald-400" id="modalTitle">Nuova Camminata</h2>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-200 text-2xl">✕</button>
      </div>

      <form id="addForm" onsubmit="handleSubmitHike(event)" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nome</label>
            <input type="text" id="f-nome" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Data</label>
            <input type="date" id="f-data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Dislivello (m)</label>
            <input type="number" id="f-dislivello" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tempo (h)</label>
            <input type="number" id="f-tempo" min="0" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Lunghezza (km)</label>
            <input type="number" id="f-lunghezza" min="0" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Difficoltà</label>
            <select id="f-difficolta" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">—</option>
              <option value="⭐">⭐</option>
              <option value="⭐⭐">⭐⭐</option>
              <option value="⭐⭐⭐">⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
              <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Stagione</label>
            <select id="f-stagione" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">—</option>
              <option value="🌱">🌱 Primavera</option>
              <option value="☀️">☀️ Estate</option>
              <option value="🍂">🍂 Autunno</option>
              <option value="❄️">❄️ Inverno</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Comune</label>
            <input type="text" id="f-comune" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Parcheggio (lat, lon)</label>
          <input type="text" id="f-parcheggio" placeholder="46.74, 11.67" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <div class="flex gap-3">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="f-passegino" class="w-4 h-4 accent-emerald-500">
            <span class="text-xs text-slate-300">👶 Passeggino</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="f-parco" class="w-4 h-4 accent-emerald-500">
            <span class="text-xs text-slate-300">🛝 Parco Giochi</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Link</label>
          <input type="url" id="f-link" placeholder="https://" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Note</label>
          <textarea id="f-note" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="f-fatto" class="w-4 h-4 accent-emerald-500">
          <span class="text-xs text-slate-300">✓ Completata</span>
        </label>

        <div class="flex gap-2 pt-4 border-t border-slate-700">
          <button type="button" onclick="closeModal('addModal')" class="flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-semibold hover:bg-slate-600">Annulla</button>
          <button type="submit" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-500">Salva</button>
          <button type="button" id="btnDelete" onclick="deleteCurrentHike()" class="px-4 py-2 bg-red-600/20 text-red-400 rounded-lg font-semibold hover:bg-red-600/30 hidden">Elimina</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhUWhYvYxtk5adisXsyVac3fZhmDlHcDYM3m9AzOYmU8WtVGu9ZWKfqwCM9txn5jkpVQ/exec";
    
    let hikes = [];
    let map = null;
    let currentEditId = null;
    let markersGroup = null;

    // ===== INIT =====
    async function init() {
      await loadHikes();
      renderAll();
      initMap();
      setupFilterListeners();
    }

    // ===== LOAD HIKES =====
    async function loadHikes() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const data = await response.json();
        if (Array.isArray(data)) {
          hikes = data;
        } else {
          console.error("Dati non validi:", data);
          hikes = [];
        }
      } catch (err) {
        console.error("Errore caricamento:", err);
      }
    }

    // ===== RENDER ALL =====
    function renderAll() {
      renderStats();
      renderTodo();
      renderFatto();
      updateMapMarkers();
      updateCharts();
    }

    // ===== STATS =====
    function renderStats() {
      const done = hikes.filter(h => h.completed);
      const totalElevation = done.reduce((s, h) => s + h.elevation, 0);
      const totalDuration = done.reduce((s, h) => s + h.duration, 0);
      const totalKm = done.reduce((s, h) => s + h.distance, 0);

      document.getElementById("statTotal").textContent = done.length;
      document.getElementById("statElevation").textContent = totalElevation + "m";
      document.getElementById("statHours").textContent = (totalDuration).toFixed(1) + "h";
      document.getElementById("statKm").textContent = totalKm.toFixed(1) + "km";
      
      document.getElementById("countDone").textContent = done.length;
      document.getElementById("countTodo").textContent = hikes.filter(h => !h.completed).length;
    }

    // ===== FILTRI =====
    function setupFilterListeners() {
      document.getElementById("filterNome").addEventListener("input", () => renderTodo());
      document.getElementById("filterDifficolta").addEventListener("change", () => renderTodo());
      document.getElementById("filterStagione").addEventListener("change", () => renderTodo());
      document.getElementById("filterPasseggino").addEventListener("change", () => renderTodo());
      document.getElementById("filterParco").addEventListener("change", () => renderTodo());

      document.getElementById("filterNomeDone").addEventListener("input", () => renderFatto());
      document.getElementById("filterDifficoltaDone").addEventListener("change", () => renderFatto());
      document.getElementById("filterStagioneDone").addEventListener("change", () => renderFatto());
      document.getElementById("filterPasseginoDone").addEventListener("change", () => renderFatto());
      document.getElementById("filterParcoDone").addEventListener("change", () => renderFatto());
    }

    function getFilteredTodo() {
      let filtered = hikes.filter(h => !h.completed);
      
      const nome = document.getElementById("filterNome").value.toLowerCase();
      const difficolta = document.getElementById("filterDifficolta").value;
      const stagione = document.getElementById("filterStagione").value;
      const passeggino = document.getElementById("filterPasseggino").checked;
      const parco = document.getElementById("filterParco").checked;

      filtered = filtered.filter(h => {
        if (nome && !h.title.toLowerCase().includes(nome)) return false;
        if (difficolta && h.difficulty !== difficolta) return false;
        if (stagione && h.season !== stagione) return false;
        if (passeggino && !h.stroller) return false;
        if (parco && !h.park) return false;
        return true;
      });

      return filtered;
    }

    function getFilteredFatto() {
      let filtered = hikes.filter(h => h.completed);
      
      const nome = document.getElementById("filterNomeDone").value.toLowerCase();
      const difficolta = document.getElementById("filterDifficoltaDone").value;
      const stagione = document.getElementById("filterStagioneDone").value;
      const passeggino = document.getElementById("filterPasseginoDone").checked;
      const parco = document.getElementById("filterParcoDone").checked;

      filtered = filtered.filter(h => {
        if (nome && !h.title.toLowerCase().includes(nome)) return false;
        if (difficolta && h.difficulty !== difficolta) return false;
        if (stagione && h.season !== stagione) return false;
        if (passeggino && !h.stroller) return false;
        if (parco && !h.park) return false;
        return true;
      });

      return filtered;
    }

    // ===== RENDER TODO =====
    function renderTodo() {
      const filtered = getFilteredTodo();
      const html = filtered.map(h => createHikeCard(h)).join("");
      document.getElementById("gridTodo").innerHTML = html || '<div class="col-span-full text-center text-slate-400 text-sm py-8">Nessuna camminata trovata</div>';
    }

    // ===== RENDER FATTO =====
    function renderFatto() {
      const filtered = getFilteredFatto();
      const html = filtered.map(h => createHikeCard(h)).join("");
      document.getElementById("gridFatto").innerHTML = html || '<div class="col-span-full text-center text-slate-400 text-sm py-8">Nessuna camminata trovata</div>';
    }

    // ===== CREATE HIKE CARD =====
    function createHikeCard(h) {
      return `
        <div onclick="editHike(${h.rowIndex})" class="bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer hover:border-emerald-500/50 transition-colors">
          <div class="flex justify-between items-start mb-2">
            <h4 class="font-bold text-sm text-slate-100">${h.title}</h4>
            <span class="text-xs ${h.completed ? 'text-emerald-400' : 'text-amber-400'}">${h.completed ? '✓' : '○'}</span>
          </div>
          <p class="text-xs text-slate-400 mb-2">${h.location || '—'} | ${h.date || '—'}</p>
          <div class="flex gap-2 flex-wrap text-xs text-slate-300">
            <span>⏱️ ${h.duration}h</span>
            <span>⛰️ <span class="text-amber-400 font-semibold">+${h.elevation}m</span></span>
            <span>📏 ${h.distance}km</span>
            <span>${h.difficulty || '—'}</span>
          </div>
          ${h.stroller ? '<p class="text-xs text-sky-400 mt-1">👶 Passeggino</p>' : ''}
          ${h.park ? '<p class="text-xs text-purple-400">🛝 Parco Giochi</p>' : ''}
          ${h.notes ? `<p class="text-xs text-slate-400 mt-2">${h.notes}</p>` : ''}
        </div>
      `;
    }

    // ===== MODAL FUNCTIONS =====
    function openAddModal() {
      currentEditId = null;
      document.getElementById("modalTitle").textContent = "Nuova Camminata";
      document.getElementById("btnDelete").classList.add("hidden");
      document.getElementById("addForm").reset();
      document.getElementById("f-data").valueAsDate = new Date();
      document.getElementById("addModal").classList.remove("hidden");
    }

    function editHike(rowIndex) {
      const h = hikes.find(hh => hh.rowIndex === rowIndex);
      if (!h) return;
      
      currentEditId = rowIndex;
      document.getElementById("modalTitle").textContent = "Modifica Camminata";
      document.getElementById("btnDelete").classList.remove("hidden");
      
      document.getElementById("f-nome").value = h.title || '';
      document.getElementById("f-data").value = h.date || '';
      document.getElementById("f-dislivello").value = h.elevation || '';
      document.getElementById("f-tempo").value = h.duration || '';
      document.getElementById("f-lunghezza").value = h.distance || '';
      document.getElementById("f-difficolta").value = h.difficulty || '';
      document.getElementById("f-stagione").value = h.season || '';
      document.getElementById("f-comune").value = h.location || '';
      document.getElementById("f-parcheggio").value = h.lat && h.lng ? `${h.lat}, ${h.lng}` : '';
      document.getElementById("f-passegino").checked = h.stroller;
      document.getElementById("f-parco").checked = h.park;
      document.getElementById("f-link").value = h.trackUrl || '';
      document.getElementById("f-note").value = h.notes || '';
      document.getElementById("f-fatto").checked = h.completed;
      
      document.getElementById("addModal").classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // ===== SUBMIT HIKE =====
    async function handleSubmitHike(e) {
      e.preventDefault();
      
      let lat = null, lng = null;
      const coordsVal = document.getElementById("f-parcheggio").value;
      if (coordsVal && coordsVal.includes(",")) {
        const parts = coordsVal.split(",");
        lat = parseFloat(parts[0].trim());
        lng = parseFloat(parts[1].trim());
      }

      const data = {
        "Nome": document.getElementById("f-nome").value,
        "Data": document.getElementById("f-data").value,
        "Dislivello": parseInt(document.getElementById("f-dislivello").value) || 0,
        "Tempo (h)": parseFloat(document.getElementById("f-tempo").value) || 0,
        "Lunghezza (km)": parseFloat(document.getElementById("f-lunghezza").value) || 0,
        "Difficoltà": document.getElementById("f-difficolta").value,
        "Stagione": document.getElementById("f-stagione").value,
        "Comune": document.getElementById("f-comune").value,
        "Parcheggio": lat && lng ? `${lat}, ${lng}` : '',
        "Passegino": document.getElementById("f-passegino").checked ? "SI" : "NO",
        "Parco": document.getElementById("f-parco").checked ? "SI" : "NO",
        "Link": document.getElementById("f-link").value,
        "Note": document.getElementById("f-note").value,
        "Fatto": document.getElementById("f-fatto").checked ? "SI" : "NO"
      };

      try {
        const action = currentEditId !== null ? "update" : "add";
        const url = `${GOOGLE_SCRIPT_URL}?action=${action}${currentEditId !== null ? `&rowIndex=${currentEditId}` : ''}`;
        
        const response = await fetch(url, {
          method: "POST",
          body: JSON.stringify(data)
        });

        const result = await response.json();
        console.log(`Risultato: ${action}`, result);

        closeModal("addModal");
        
        setTimeout(() => {
          loadHikes().then(() => renderAll());
        }, 500);

      } catch (err) {
        console.error("Errore salvataggio:", err);
        alert("Errore nel salvataggio");
      }
    }

    // ===== DELETE HIKE =====
    async function deleteCurrentHike() {
      if (currentEditId === null) return;
      if (!confirm("Eliminare questa camminata?")) return;

      try {
        const url = `${GOOGLE_SCRIPT_URL}?action=delete&rowIndex=${currentEditId}`;
        const response = await fetch(url, { method: "POST" });
        const result = await response.json();

        console.log("Eliminazione:", result);
        closeModal("addModal");
        
        setTimeout(() => {
          loadHikes().then(() => renderAll());
        }, 500);

      } catch (err) {
        console.error("Errore eliminazione:", err);
        alert("Errore nell'eliminazione");
      }
    }

    // ===== MAP =====
    function initMap() {
      if (map) map.remove();
      map = L.map("fullMap").setView([46.5, 11.3], 9);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
      }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);
      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!markersGroup) return;
      markersGroup.clearLayers();
      
      const withCoords = hikes.filter(h => h.lat && h.lng);
      withCoords.forEach(h => {
        const marker = L.marker([h.lat, h.lng]);
        marker.bindPopup(`<div class="text-sm"><strong>${h.title}</strong><br>⏱️ ${h.duration}h | ⛰️ +${h.elevation}m</div>`);
        markersGroup.addLayer(marker);
      });

      if (withCoords.length > 0) {
        const bounds = L.latLngBounds(withCoords.map(h => [h.lat, h.lng]));
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // ===== TAB SWITCHING =====
    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${tab}`).classList.remove("hidden");

      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("text-emerald-400"));
      document.getElementById(`nav-${tab}`).classList.add("text-emerald-400");

      if (tab === "mappa" && map) {
        setTimeout(() => map.invalidateSize(), 150);
      }
    }

    // ===== CHARTS =====
    function updateCharts() {
      const done = hikes.filter(h => h.completed).length;
      const todo = hikes.filter(h => !h.completed).length;

      const ctx1 = document.getElementById("chartCompletion");
      if (ctx1 && ctx1._chart) ctx1._chart.destroy();
      if (ctx1) {
        ctx1._chart = new Chart(ctx1, {
          type: "doughnut",
          data: {
            labels: ["Completate", "Da fare"],
            datasets: [{
              data: [done, todo],
              backgroundColor: ["#10b981", "#f59e0b"],
              borderColor: "#1e293b"
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const doneHikes = hikes.filter(h => h.completed);
      const ctx2 = document.getElementById("chartElevation");
      if (ctx2 && ctx2._chart) ctx2._chart.destroy();
      if (ctx2) {
        ctx2._chart = new Chart(ctx2, {
          type: "bar",
          data: {
            labels: doneHikes.map(h => h.title),
            datasets: [{
              label: "Dislivello (m)",
              data: doneHikes.map(h => h.elevation),
              backgroundColor: "#f59e0b",
              borderColor: "#1e293b"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: "y",
            scales: { x: { beginAtZero: true } }
          }
        });
      }
    }

    init();
  </script>
</body>
</html>
