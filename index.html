<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camminate Dashboard</title>
  
  <!-- PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    .leaflet-control-layers { z-index: 25 !important; }
    .modal-backdrop { z-index: 9998 !important; }
    .modal-content { z-index: 9999 !important; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .spinner {
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top: 3px solid #10b981;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col pb-16">

  <!-- HEADER -->
  <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700/80 sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🥾</span>
      <div>
        <h1 class="font-bold text-base md:text-lg text-emerald-400 leading-tight">Camminate</h1>
        <p class="text-[10px] text-slate-400">Trentino & Alto Adige</p>
      </div>
    </div>
    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold flex items-center gap-1.5 shadow-lg transition-all">
      <span>➕</span> <span class="hidden sm:inline">Nuova</span>
    </button>
  </header>

  <!-- TABS NAVIGATION (BOTTOM) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/95 border-t border-slate-700 flex justify-around z-30">
    <button onclick="switchTab('mappa')" id="nav-mappa" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-emerald-400 hover:bg-slate-700/50">🗺️ Mappa</button>
    <button onclick="switchTab('fatto')" id="nav-fatto" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">✓ Fatto</button>
    <button onclick="switchTab('dafare')" id="nav-dafare" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">📝 Da fare</button>
    <button onclick="switchTab('stats')" id="nav-stats" class="nav-btn flex-1 py-3 text-center text-xs md:text-sm font-semibold text-slate-400 hover:bg-slate-700/50">📊 Stats</button>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-5">

    <!-- TAB: MAPPA -->
    <section id="tab-mappa" class="tab-content space-y-4">
      <div id="fullMap" class="w-full h-[calc(100vh-200px)] rounded-xl overflow-hidden border border-slate-700 shadow-md"></div>
    </section>

    <!-- TAB: FATTO -->
    <section id="tab-fatto" class="tab-content hidden space-y-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3">
        <p class="text-xs text-slate-400">Completate: <span id="countDone" class="font-bold text-emerald-400">0</span></p>
      </div>
      <div id="gridFatto" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB: DA FARE -->
    <section id="tab-dafare" class="tab-content hidden space-y-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3">
        <p class="text-xs text-slate-400">Da completare: <span id="countTodo" class="font-bold text-amber-400">0</span></p>
      </div>
      <div id="gridTodo" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB: STATS -->
    <section id="tab-stats" class="tab-content hidden space-y-5">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Fatte</p>
          <p id="statTotal" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Km</p>
          <p id="statKm" class="text-2xl font-bold text-sky-400 mt-1">0</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Dislivello</p>
          <p id="statElevation" class="text-2xl font-bold text-amber-400 mt-1">0m</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl text-center">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-medium">Ore</p>
          <p id="statHours" class="text-2xl font-bold text-purple-400 mt-1">0h</p>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
          <h4 class="text-xs font-bold text-slate-300 mb-3">Stato</h4>
          <canvas id="chartCompletion"></canvas>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-xl">
          <h4 class="text-xs font-bold text-slate-300 mb-3">Dislivello per Uscita</h4>
          <canvas id="chartElevation"></canvas>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: AGGIUNGI/MODIFICA -->
  <div id="addModal" class="modal-backdrop hidden fixed inset-0 bg-black/50 flex items-end z-9998">
    <div class="modal-content w-full bg-slate-800 rounded-t-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-emerald-400" id="modalTitle">Nuova Camminata</h2>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-200 text-2xl">✕</button>
      </div>

      <form id="addForm" onsubmit="handleSubmitHike(event)" class="space-y-4">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Nome Montagna</label>
            <input type="text" id="f-nome" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Data</label>
            <input type="date" id="f-data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Dislivello (m)</label>
            <input type="number" id="f-dislivello" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Durata (min)</label>
            <input type="number" id="f-durata" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Difficoltà</label>
            <select id="f-difficolta" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">—</option>
              <option value="⭐">⭐ Facile</option>
              <option value="⭐⭐">⭐⭐ Medio-Facile</option>
              <option value="⭐⭐⭐">⭐⭐⭐ Media</option>
              <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ Impegnativa</option>
              <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ Esperti</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tipologia</label>
            <select id="f-tipologia" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">—</option>
              <option value="Camminata">Camminata</option>
              <option value="Ferrata">Ferrata</option>
              <option value="Arrampicata">Arrampicata</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Km</label>
            <input type="number" id="f-km" min="0" step="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Comune</label>
            <input type="text" id="f-comune" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Parcheggio (lat, lon)</label>
            <input type="text" id="f-parcheggio" placeholder="46.74, 11.67" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Stagione</label>
            <select id="f-stagione" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">—</option>
              <option value="🌱 Primavera">🌱 Primavera</option>
              <option value="☀️ Estate">☀️ Estate</option>
              <option value="🍂 Autunno">🍂 Autunno</option>
              <option value="❄️ Inverno">❄️ Inverno</option>
            </select>
          </div>
        </div>

        <div class="flex gap-3">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="f-passeggino" class="w-4 h-4 accent-emerald-500">
            <span class="text-xs text-slate-300">👶 Passeggino</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="f-parco" class="w-4 h-4 accent-emerald-500">
            <span class="text-xs text-slate-300">🛝 Parco Giochi</span>
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Link Traccia</label>
          <input type="url" id="f-link" placeholder="https://" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Note</label>
          <textarea id="f-note" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
        </div>

        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="f-fatta" class="w-4 h-4 accent-emerald-500">
          <span class="text-xs text-slate-300">✓ Completata</span>
        </label>

        <div class="flex gap-2 pt-4 border-t border-slate-700">
          <button type="button" onclick="closeModal('addModal')" class="flex-1 px-4 py-2 bg-slate-700 text-slate-300 rounded-lg font-semibold hover:bg-slate-600">Annulla</button>
          <button type="submit" class="flex-1 px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-500">Salva</button>
          <button type="button" id="btnDelete" onclick="deleteCurrentHike()" class="px-4 py-2 bg-red-600/20 text-red-400 rounded-lg font-semibold hover:bg-red-600/30 hidden">Elimina</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxT3aT7YM86IrXwusaR868D8vppk9NVCx_VYJgcUH4LhT_ISrG9brEVIFL1qZM4TuyXA/exec";
    
    let hikes = [];
    let map = null;
    let currentEditId = null;
    let markersGroup = null;

    // ===== INIT =====
    async function init() {
      await loadHikes();
      renderAll();
      initMap();
    }

    // ===== LOAD HIKES FROM GOOGLE SHEETS =====
    async function loadHikes() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        hikes = await response.json();
        console.log("Dati caricati:", hikes.length, "camminate");
        console.log("Camminate :", hikes, "camminate");
      } catch (err) {
        console.error("Errore caricamento:", err);
        alert("Errore nel caricamento dei dati. Controlla la connessione.");
      }
    }

    // ===== RENDER ALL SECTIONS =====
    function renderAll() {
      renderStats();
      renderFatto();
      renderTodo();
      updateMapMarkers();
      updateCharts();
    }

    // ===== STATS =====
    function renderStats() {
      const done = hikes.filter(h => h.completed);
      const totalElevation = done.reduce((s, h) => s + h.elevation, 0);
      const totalDuration = done.reduce((s, h) => s + h.duration, 0);
      const totalKm = done.reduce((s, h) => s + h.distance, 0);

      document.getElementById("statTotal").textContent = done.length;
      document.getElementById("statElevation").textContent = totalElevation + "m";
      document.getElementById("statHours").textContent = (totalDuration / 60).toFixed(1) + "h";
      document.getElementById("statKm").textContent = totalKm.toFixed(1) + "km";
      
      document.getElementById("countDone").textContent = done.length;
      document.getElementById("countTodo").textContent = hikes.filter(h => !h.completed).length;
    }

    // ===== RENDER FATTO =====
    function renderFatto() {
      const done = hikes.filter(h => h.completed);
      const html = done.map(h => createHikeCard(h)).join("");
      document.getElementById("gridFatto").innerHTML = html || '<div class="col-span-full text-center text-slate-400 text-sm py-8">Nessuna camminata completata</div>';
    }

    // ===== RENDER TODO =====
    function renderTodo() {
      const todo = hikes.filter(h => !h.completed);
      const html = todo.map(h => createHikeCard(h)).join("");
      document.getElementById("gridTodo").innerHTML = html || '<div class="col-span-full text-center text-slate-400 text-sm py-8">Nessuna camminata in sospeso</div>';
    }

    // ===== CREATE HIKE CARD =====
    function createHikeCard(h) {
      return `
        <div onclick="editHike(${h.rowIndex})" class="bg-slate-800 border border-slate-700 rounded-xl p-4 cursor-pointer hover:border-emerald-500/50 transition-colors">
          <div class="flex justify-between items-start mb-2">
            <h4 class="font-bold text-sm text-slate-100">${h.title}</h4>
            <span class="text-xs ${h.completed ? 'text-emerald-400' : 'text-amber-400'}">${h.completed ? '✓' : '○'}</span>
          </div>
          <p class="text-xs text-slate-400 mb-2">${h.location || '—'} | ${h.date || '—'}</p>
          <div class="flex gap-2 flex-wrap text-xs text-slate-300">
            <span>⏱️ ${h.duration}min</span>
            <span>⛰️ <span class="text-amber-400 font-semibold">+${h.elevation}m</span></span>
            <span>${h.difficulty || '—'}</span>
          </div>
          ${h.notes ? `<p class="text-xs text-slate-400 mt-2">${h.notes}</p>` : ''}
        </div>
      `;
    }

    // ===== MODAL FUNCTIONS =====
    function openAddModal() {
      currentEditId = null;
      document.getElementById("modalTitle").textContent = "Nuova Camminata";
      document.getElementById("btnDelete").classList.add("hidden");
      document.getElementById("addForm").reset();
      document.getElementById("f-data").valueAsDate = new Date();
      document.getElementById("addModal").classList.remove("hidden");
    }

    function editHike(rowIndex) {
      const h = hikes.find(hh => hh.rowIndex === rowIndex);
      if (!h) return;
      
      currentEditId = rowIndex;
      document.getElementById("modalTitle").textContent = "Modifica Camminata";
      document.getElementById("btnDelete").classList.remove("hidden");
      
      document.getElementById("f-nome").value = h.title || '';
      document.getElementById("f-data").value = h.date || '';
      document.getElementById("f-dislivello").value = h.elevation || '';
      document.getElementById("f-durata").value = h.duration || '';
      document.getElementById("f-difficolta").value = h.difficulty || '';
      document.getElementById("f-tipologia").value = h.type || '';
      document.getElementById("f-km").value = h.distance || '';
      document.getElementById("f-comune").value = h.location || '';
      document.getElementById("f-parcheggio").value = h.lat && h.lng ? `${h.lat}, ${h.lng}` : '';
      document.getElementById("f-stagione").value = h.season || '';
      document.getElementById("f-passeggino").checked = h.stroller;
      document.getElementById("f-parco").checked = h.parcoGiochi;
      document.getElementById("f-link").value = h.trackUrl || '';
      document.getElementById("f-note").value = h.notes || '';
      document.getElementById("f-fatta").checked = h.completed;
      
      document.getElementById("addModal").classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // ===== SUBMIT HIKE =====
    async function handleSubmitHike(e) {
      e.preventDefault();
      
      let lat = null, lng = null;
      const coordsVal = document.getElementById("f-parcheggio").value;
      if (coordsVal && coordsVal.includes(",")) {
        const parts = coordsVal.split(",");
        lat = parseFloat(parts[0].trim());
        lng = parseFloat(parts[1].trim());
      }

      const data = {
        title: document.getElementById("f-nome").value,
        date: document.getElementById("f-data").value,
        elevation: parseInt(document.getElementById("f-dislivello").value) || 0,
        duration: parseInt(document.getElementById("f-durata").value) || 0,
        difficulty: document.getElementById("f-difficolta").value,
        type: document.getElementById("f-tipologia").value,
        distance: parseFloat(document.getElementById("f-km").value) || 0,
        location: document.getElementById("f-comune").value,
        season: document.getElementById("f-stagione").value,
        stroller: document.getElementById("f-passeggino").checked,
        parcoGiochi: document.getElementById("f-parco").checked,
        trackUrl: document.getElementById("f-link").value,
        notes: document.getElementById("f-note").value,
        completed: document.getElementById("f-fatta").checked,
        lat: lat,
        lng: lng
      };

      try {
        const action = currentEditId !== null ? "update" : "add";
        const url = `${GOOGLE_SCRIPT_URL}?action=${action}${currentEditId !== null ? `&rowIndex=${currentEditId}` : ''}`;
        
        const response = await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });

        console.log(`Camminata ${action === 'add' ? 'aggiunta' : 'aggiornata'}`);
        closeModal("addModal");
        
        // Ricarica i dati dopo 1 secondo
        setTimeout(() => {
          loadHikes().then(() => renderAll());
        }, 1000);

      } catch (err) {
        console.error("Errore salvataggio:", err);
        alert("Errore nel salvataggio. Riprova.");
      }
    }

    // ===== DELETE HIKE =====
    async function deleteCurrentHike() {
      if (currentEditId === null) return;
      if (!confirm("Eliminare questa camminata?")) return;

      try {
        const url = `${GOOGLE_SCRIPT_URL}?action=delete&rowIndex=${currentEditId}`;
        await fetch(url, { method: "POST", mode: "no-cors" });

        console.log("Camminata eliminata");
        closeModal("addModal");
        
        setTimeout(() => {
          loadHikes().then(() => renderAll());
        }, 1000);

      } catch (err) {
        console.error("Errore eliminazione:", err);
        alert("Errore nell'eliminazione. Riprova.");
      }
    }

    // ===== MAP =====
    function initMap() {
      if (map) map.remove();
      map = L.map("fullMap").setView([46.5, 11.3], 9);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
      }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);
      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!markersGroup) return;
      markersGroup.clearLayers();
      
      const withCoords = hikes.filter(h => h.lat && h.lng);
      withCoords.forEach(h => {
        const marker = L.marker([h.lat, h.lng]);
        marker.bindPopup(`
          <div class="text-slate-900 text-sm font-semibold">${h.title}</div>
          <div class="text-xs text-slate-600">⏱️ ${h.duration}min | ⛰️ +${h.elevation}m</div>
        `);
        markersGroup.addLayer(marker);
      });

      if (withCoords.length > 0) {
        const bounds = L.latLngBounds(withCoords.map(h => [h.lat, h.lng]));
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // ===== TAB SWITCHING =====
    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`tab-${tab}`).classList.remove("hidden");

      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("text-emerald-400"));
      document.getElementById(`nav-${tab}`).classList.add("text-emerald-400");

      if (tab === "mappa" && map) {
        setTimeout(() => map.invalidateSize(), 150);
      } else if (tab === "stats") {
        updateCharts();
      }
    }

    // ===== CHARTS =====
    function updateCharts() {
      const done = hikes.filter(h => h.completed).length;
      const todo = hikes.filter(h => !h.completed).length;

      // Chart 1: Completamento
      const ctx1 = document.getElementById("chartCompletion");
      if (ctx1 && ctx1._chart) ctx1._chart.destroy();
      if (ctx1) {
        ctx1._chart = new Chart(ctx1, {
          type: "doughnut",
          data: {
            labels: ["Completate", "Da fare"],
            datasets: [{
              data: [done, todo],
              backgroundColor: ["#10b981", "#f59e0b"],
              borderColor: "#1e293b"
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      // Chart 2: Dislivello per uscita
      const doneHikes = hikes.filter(h => h.completed);
      const ctx2 = document.getElementById("chartElevation");
      if (ctx2 && ctx2._chart) ctx2._chart.destroy();
      if (ctx2) {
        ctx2._chart = new Chart(ctx2, {
          type: "bar",
          data: {
            labels: doneHikes.map(h => h.title),
            datasets: [{
              label: "Dislivello (m)",
              data: doneHikes.map(h => h.elevation),
              backgroundColor: "#f59e0b",
              borderColor: "#1e293b"
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: "y",
            scales: { x: { beginAtZero: true } }
          }
        });
      }
    }

    // ===== START =====
    init();
  </script>
</body>
</html>
